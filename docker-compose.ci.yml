# ArchiTrack Docker Compose CI Environment Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml up
#
# CI環境では標準ポート（5432, 6379, 3000, 5173）を使用
# ローカルテスト環境（docker-compose.test.yml）とは異なり、
# 同時実行を想定しないためポートオフセットは不要

services:
  # PostgreSQL Database (CI)
  postgres:
    container_name: architrack-postgres
    environment:
      POSTGRES_DB: architrack_test
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    # CI環境ではデータ永続化不要
    tmpfs:
      - /var/lib/postgresql/data

  # Redis (CI)
  redis:
    container_name: architrack-redis
    ports:
      - "6379:6379"
    tmpfs:
      - /data

  # Mailhog (CI)
  mailhog:
    container_name: architrack-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # Backend API (CI)
  backend:
    container_name: architrack-backend
    # CI環境ではrootで実行して権限問題を回避
    user: "0:0"
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/architrack_test
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: info
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      DISABLE_RATE_LIMIT: "true"
      # 信頼する中継の段数（送信元 IP の識別。user-authentication 要件35.1）。画面の API は
      # frontend の nginx の中継（1 段）を通るため 1 にする（backend の公開ポートへ直接つなぐ
      # E2E の API_BASE_URL の要求は中継を通らない。本番は backend の公開ドメインを閉じる）
      TRUST_PROXY_HOPS: 1
      # 監査ログのアーカイブの暗号鍵（user-authentication 要件41.3）。試験専用の固定値で秘密ではない。
      # 本番・staging では使わず、Railway の変数に別の乱数の鍵を設定する
      ARCHIVE_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      # セキュリティ上の異常の検知の閾値（user-authentication 要件43.7）。ci.yml が書き出す .env の値を使い、
      # E2E の全件の実行で超えず途中で管理者への通知が流れないようにする（未設定でも同じ高い値に倒す）
      SECURITY_ALERT_LOGIN_FAILED_THRESHOLD: ${SECURITY_ALERT_LOGIN_FAILED_THRESHOLD:-1000000}
      SECURITY_ALERT_PERMISSION_DENIED_THRESHOLD: ${SECURITY_ALERT_PERMISSION_DENIED_THRESHOLD:-1000000}
      SECURITY_ALERT_RATE_LIMITED_THRESHOLD: ${SECURITY_ALERT_RATE_LIMITED_THRESHOLD:-1000000}
      SECURITY_ALERT_SERVER_ERROR_THRESHOLD: ${SECURITY_ALERT_SERVER_ERROR_THRESHOLD:-1000000}
      SECURITY_ALERT_DATA_EXPORT_THRESHOLD: ${SECURITY_ALERT_DATA_EXPORT_THRESHOLD:-1000000}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: noreply@architrack.com
      # Storage Configuration (Local filesystem for CI environment)
      STORAGE_TYPE: local
      LOCAL_STORAGE_PATH: /app/storage
      LOCAL_STORAGE_URL: http://localhost:3000/storage
      # Initial Admin Account
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminTest123!@#}
      INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:-System Administrator}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_ci_node_modules:/app/node_modules
      # Use tmpfs for ephemeral test storage (auto-cleaned, writable by all users)
      - type: tmpfs
        target: /app/storage
        tmpfs:
          mode: 01777

  # Frontend (CI) - 本番相当構成（nginx + ビルド済み静的ファイル）
  # Dev/prod parity: CI環境でもnginxを使用し、本番固有の問題を早期検出する
  frontend:
    container_name: architrack-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 画面の API の接続先は画面と同じオリジン（nginx が /api/ を backend へ中継する。
        # user-authentication design.md「画面配信」）。完全な URL を渡し、フロントの既定値
        # （http://localhost:3000）へ落ちないようにする
        VITE_API_URL: http://localhost:5173
    # nginx:alpineはroot権限で実行
    user: "0:0"
    # nginx:alpineにはcurlがないためwgetを使用
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      PORT: 80
      # API の中継先（compose の backend のサービス。空なら起動前の検査で起動しない）
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "5173:80"
    # 本番Dockerfileはビルド済み静的ファイルを含むため、ソースコードのマウント不要

volumes:
  backend_ci_node_modules:
    name: architrack_backend_ci_node_modules
