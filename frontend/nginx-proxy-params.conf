# backend への中継の共通設定（nginx.conf の /api/・/csrf-token・/oauth/・認可サーバーのメタデータの
# location が取り込む）。本文の上限は経路ごとに違うので、ここに置かず各 location に書く
#
# 送信元の情報: 受け取った X-Forwarded-For の末尾にこの nginx が見た接続元を足す。
# backend は信頼する中継の段数（TRUST_PROXY_HOPS）だけ末尾から数えて送信元を決めるため、
# 利用者が先頭に偽の値を書いても送信元は変わらない（user-authentication 要件35.1）。
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $architrack_forwarded_proto;

# タイムアウト: 画面の最も長い待ち（アップロードの 120 秒、Claude Vision の 60 秒）と
# 出力の生成を、nginx の既定（60 秒）で切らない
proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# セキュリティヘッダー: backend（helmet）が付ける同じ名前のヘッダーを外し、nginx.conf のサーバーの
# 階層の取り込み（security-headers.conf）の値だけを返す（同じ名前のヘッダーが二つにならないように）
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
