# 画面と静的ファイルの全応答のセキュリティヘッダー
# （user-authentication 要件44.1・44.2、design.md の FrontendNginxConfig）
#
# nginx の公式イメージの 20-envsubst-on-templates.sh がこのテンプレートの ${...} を環境変数で
# 置き換え、/etc/nginx/conf.d/architrack/security-headers.conf を生成する（conf.d 直下の
# *.conf の取り込みには入らない）。nginx.conf のサーバーの階層と、add_header を持つ全ての
# location が取り込む（add_header を持つ location はサーバーの階層の add_header を継承しないため）。
#
# 環境ごとの値（Dockerfile が空の既定を持つ。空の環境変数も置き換えの対象になる）:
# - CSP_IMG_SRC_EXTRA: 画像の追加の取得先（R2 の署名 URL の配信元など。空白区切り）
# - CSP_CONNECT_SRC_EXTRA: 接続の追加の取得先（R2 の配信元、Sentry の取り込み先など。空白区切り）
# - NGINX_HSTS_VALUE: Strict-Transport-Security の値。本番だけ設定する。空の環境では nginx が
#   値の空の add_header を送らないため HSTS は付かない
# connect-src の blob:・data: は PDF のプレビュー（react-pdf が blob の URL を fetch する）と現場調査の
# 一括エクスポート（data の URL を fetch する）のため（design の判断 2026-10-25）
# Tesseract.js の worker・コア・言語データは画面と同じオリジンから配信するため（vite.config.ts の
# tesseractAssetsPlugin。是正計画 D14、2026-11-07）、cdn.jsdelivr.net・tessdata.projectnaptha.com を許可しない
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: ${CSP_IMG_SRC_EXTRA}; connect-src 'self' blob: data: ${CSP_CONNECT_SRC_EXTRA}; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "${NGINX_HSTS_VALUE}" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
