# 中継先へ渡す元のプロトコル。手前の中継（Railway のエッジ）が付けた X-Forwarded-Proto を
# そのまま渡し、無ければこの nginx が受けたプロトコルを渡す（エッジで TLS を終端する本番で
# backend が https の要求を http と誤認しないため）
map $http_x_forwarded_proto $architrack_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# アクセスログの書式: 要求の行（$request）でなくクエリを含まない $uri を記録し、参照元（Referer）も
# 記録しない（URL のクエリや参照元に残りうるトークンを記録に残さない。user-authentication 要件37.3）
log_format architrack '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 応答の Server と既定のエラーページに nginx の版を出さない（user-authentication 要件44.3）
    server_tokens off;

    access_log /var/log/nginx/access.log architrack;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # セキュリティヘッダー（user-authentication 要件44.1・44.2、design.md の FrontendNginxConfig）。
    # add_header を持つ location はこの階層の add_header を継承しないため、そのような location にも
    # 同じ取り込みを置く。/api/ と /csrf-token の中継の応答もこの階層から受け継ぎ、backend（helmet）の
    # 同じ名前のヘッダーは中継の共通設定の proxy_hide_header で外して一つにする
    include /etc/nginx/conf.d/architrack/security-headers.conf;

    # API と CSRF トークンの発行を backend へ同一オリジンで中継する
    # （user-authentication design.md「画面配信」の FrontendNginxConfig）。
    # 中継先は BACKEND_INTERNAL_URL（scheme://host[:port]。パスを持たない）で、空の値は
    # 起動前の検査（/docker-entrypoint.d/05-require-backend-internal-url.sh）で拒否する。
    # 中継先の名前は要求のたびに resolver で引き直す（backend のコンテナの作り直しや
    # Railway のプライベートネットワークで宛先が変わっても古い宛先へ送らない）。
    # NGINX_LOCAL_RESOLVERS は nginx の公式イメージが /etc/resolv.conf から設定する。
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    location = /csrf-token {
        set $architrack_backend ${BACKEND_INTERNAL_URL};
        proxy_pass $architrack_backend;
        include /etc/nginx/architrack-proxy-params.conf;
    }

    # ^~ で静的ファイルの正規表現の location（\.png$ など）より優先させる
    location ^~ /api/ {
        set $architrack_backend ${BACKEND_INTERNAL_URL};
        proxy_pass $architrack_backend;
        include /etc/nginx/architrack-proxy-params.conf;
        # 本文が中継の上限（client_max_body_size）を超えたときは、nginx の HTML でなく
        # backend のエラーと同じ形の JSON で理由を返す（画面が理由を表示できるように）
        error_page 413 @api_payload_too_large;
    }

    location @api_payload_too_large {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 413 '{"type":"https://architrack.example.com/problems/payload-too-large","title":"Payload Too Large","status":413,"detail":"アップロードの合計サイズが上限（120MB）を超えています。ファイルを分けて送ってください","code":"PAYLOAD_TOO_LARGE"}';
    }

    # Favicon handler - ブラウザのfaviconリクエストに対応
    location = /favicon.ico {
        return 204;
        access_log off;
        log_not_found off;
    }

    # .mjsファイル用MIMEタイプ設定（pdfjs-dist workerファイル等）
    # nginxのデフォルトmime.typesに.mjsが含まれない場合があるため明示的に設定
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        include /etc/nginx/conf.d/architrack/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/conf.d/architrack/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
