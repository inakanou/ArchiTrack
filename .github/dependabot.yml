version: 2
updates:
  # Root package.json (E2E tests)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # 公開直後の版を取り込まない（乗っ取られた版の公開から取り下げまでの期間を避ける）。
    # セキュリティ更新は cooldown の対象外で、すぐに PR が作られる
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    reviewers:
      - "inaka"
    assignees:
      - "inaka"
    labels:
      - "dependencies"
      - "e2e"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"

  # Backend package.json
  - package-ecosystem: "npm"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # 公開直後の版を取り込まない（乗っ取られた版の公開から取り下げまでの期間を避ける）。
    # セキュリティ更新は cooldown の対象外で、すぐに PR が作られる
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    reviewers:
      - "inaka"
    assignees:
      - "inaka"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"

  # Frontend package.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # 公開直後の版を取り込まない（乗っ取られた版の公開から取り下げまでの期間を避ける）。
    # セキュリティ更新は cooldown の対象外で、すぐに PR が作られる
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    reviewers:
      - "inaka"
    assignees:
      - "inaka"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
    # 公開直後の版を取り込まない（セキュリティ更新は対象外）
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "inaka"
    assignees:
      - "inaka"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"

  # Docker images in docker-compose*.yml
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    # 公開直後の版を取り込まない（セキュリティ更新は対象外）
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "inaka"
    assignees:
      - "inaka"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"

  # Docker base images in backend/Dockerfile*
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    # 公開直後の版を取り込まない（セキュリティ更新は対象外）
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "inaka"
    assignees:
      - "inaka"
    labels:
      - "dependencies"
      - "docker"
      - "backend"
    commit-message:
      prefix: "chore(docker):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"

  # Docker base images in frontend/Dockerfile*
  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    # 公開直後の版を取り込まない（セキュリティ更新は対象外）
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "inaka"
    assignees:
      - "inaka"
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    commit-message:
      prefix: "chore(docker):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
