# ArchiTrack Docker Compose Development Environment Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up
# Or: npm run dev:docker

services:
  # PostgreSQL Database (Development)
  postgres:
    container_name: architrack-postgres-dev
    environment:
      POSTGRES_DB: architrack_dev
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  # Redis (Development)
  redis:
    container_name: architrack-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data

  # Mailhog (Development)
  mailhog:
    container_name: architrack-mailhog-dev
    ports:
      - "127.0.0.1:1025:1025"  # SMTP port
      - "127.0.0.1:8025:8025"  # Web UI port

  # Backend API (Development)
  backend:
    container_name: architrack-backend-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/architrack_dev
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: debug
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      # 外部アプリの認可（user-authentication 要件46）。試験専用の固定値で秘密ではない。
      # 本番・staging では使わず、Railway の変数に別の値を設定する
      OAUTH_ALLOWED_CLIENTS: '[{"clientId":"architrack-test-client","clientSecret":"test-only-oauth-client-secret-not-for-production","displayName":"Test App","redirectUris":["http://127.0.0.1:4999/oauth/callback"],"tokenEndpointAuthMethod":"client_secret_post"}]'
